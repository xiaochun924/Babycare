name: Babycare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Babycare (IPA)
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 与 iOS SDK 版本
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      # 仓库已内置 Babycare.xcodeproj 与共享 Scheme，直接构建，无需 XcodeGen
      - name: 编译 Release
        run: |
          set -o pipefail
          xcodebuild \
            -project Babycare.xcodeproj \
            -scheme Babycare \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: 打包 IPA
        run: |
          APP=$(find build -type d -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app 产物"
            exit 1
          fi
          echo "产物: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr "Babycare.ipa" Payload
          ls -lh "Babycare.ipa"

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="unsigned-ipa"
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            --title "Babycare" \
            --notes "自签版本" \
            "Babycare.ipa"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Babycare-ipa
          path: Babycare.ipa
          if-no-files-found: error
          retention-days: 30
